spring.application.name=blueprintforge
# Paths are relative to backend/ (where you run mvn)
blueprint.docs-dir=../docs
blueprint.data-dir=../data
# Any OpenAI-compatible endpoint
blueprint.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
blueprint.llm.api-key=${LLM_API_KEY:}
blueprint.llm.model=${LLM_MODEL:}
spring.servlet.multipart.max-file-size=5MB
