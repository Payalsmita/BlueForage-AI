openapi: 3.1.0
info:
  title: BlueprintForge AI API
  description: "Turns past recruiting implementations into evidence-backed industry\
    \ blueprints. Errors return {\"message\": \"...\"}. Calls marked (LLM) use the\
    \ configured OpenAI-compatible endpoint."
  version: "0.3"
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/runs:
    get:
      tags:
      - api
      summary: "List Implementation Agent runs, newest first"
      operationId: runs
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"
    post:
      tags:
      - api
      summary: "(LLM) Start an Implementation Agent run for a new customer; runs in\
        \ the background, poll GET /api/runs/{id}"
      operationId: startRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentRun"
  /api/runs/{id}/approval:
    post:
      tags:
      - api
      summary: Consultant approves or rejects the handover
      operationId: approveRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentRun"
  /api/runs/{id}/answers:
    post:
      tags:
      - api
      summary: "(LLM) Answer the agent's questions (choice INCLUDE/EXCLUDE/UNSURE,\
        \ or free text the agent interprets); resumes the run"
      operationId: answerRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentRun"
  /api/extractions/{docId}:
    post:
      tags:
      - api
      summary: "(LLM) Extract stages, roles and approval rules from one doc; cached\
        \ unless force=true"
      operationId: extract
      parameters:
      - name: docId
        in: path
        required: true
        schema:
          type: string
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Extraction"
  /api/docs:
    get:
      tags:
      - api
      summary: List all source docs
      operationId: listDocs
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocMeta"
    post:
      tags:
      - api
      summary: Upload a source doc (.md/.txt as-is; .pdf/.docx/.pptx converted with
        MarkItDown)
      operationId: upload
      parameters:
      - name: docId
        in: query
        required: true
        schema:
          type: string
      - name: industry
        in: query
        required: true
        schema:
          type: string
      - name: geography
        in: query
        required: true
        schema:
          type: string
      - name: workflowType
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DocMeta"
  /api/blueprints/{industry}/{workflowType}:
    get:
      tags:
      - api
      summary: Get the saved blueprint
      operationId: get
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Blueprint"
    post:
      tags:
      - api
      summary: (LLM) Generate the blueprint for a scenario
      operationId: generate
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Blueprint"
  /api/blueprints/{industry}/{workflowType}/gap-check:
    post:
      tags:
      - api
      summary: "(LLM) Compare a new customer's notes with the blueprint: MISSING /\
        \ UNIQUE / ALIGNED"
      operationId: gapCheck
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GapRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GapReport"
  /api/blueprints/{industry}/{workflowType}/items/{itemId}:
    patch:
      tags:
      - api
      summary: "Review an item: APPROVED, EDITED (needs editedDetail) or REJECTED"
      operationId: review
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Review"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Blueprint"
  /api/runs/{id}:
    get:
      tags:
      - api
      summary: "Get a run: status, agent steps with reasoning, and every artifact\
        \ produced so far"
      operationId: run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentRun"
  /api/runs/{id}/handover.md:
    get:
      tags:
      - api
      summary: "Handover pack (Markdown): requirements, decisions, validation, UAT,\
        \ open items, agent activity"
      operationId: handover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/markdown:
              schema:
                type: string
  /api/runs/{id}/config.json:
    get:
      tags:
      - api
      summary: The run's drafted MOCK iCIMS-style configuration
      operationId: runConfig
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/groups:
    get:
      tags:
      - api
      summary: List scenarios (industry + workflow type) with doc counts
      operationId: groups
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
  /api/eval/{industry}/{workflowType}:
    get:
      tags:
      - api
      summary: Score cached extractions against the answer key (no LLM)
      operationId: eval
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EvalReport"
  /api/docs/{docId}/text:
    get:
      tags:
      - api
      summary: Get a source doc's text (Markdown)
      operationId: docText
      parameters:
      - name: docId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain;charset=UTF-8:
              schema:
                type: string
  /api/blueprints/{industry}/{workflowType}/export.md:
    get:
      tags:
      - api
      summary: Export approved + edited items as Markdown
      operationId: exportMd
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/markdown:
              schema:
                type: string
  /api/blueprints/{industry}/{workflowType}/export.json:
    get:
      tags:
      - api
      summary: Export approved + edited items as JSON
      operationId: exportJson
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Blueprint"
  /api/blueprints/{industry}/{workflowType}/export.icims.json:
    get:
      tags:
      - api
      summary: Export approved + edited items as a MOCK iCIMS-style config (not an
        official schema)
      operationId: exportIcims
      parameters:
      - name: industry
        in: path
        required: true
        schema:
          type: string
      - name: workflowType
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    StartRequest:
      type: object
      properties:
        industry:
          type: string
        workflowType:
          type: string
        customerName:
          type: string
        geography:
          type: string
        notes:
          type: string
    AgentRun:
      type: object
      properties:
        id:
          type: string
        industry:
          type: string
        workflowType:
          type: string
        customerName:
          type: string
        geography:
          type: string
        notes:
          type: string
        status:
          type: string
          enum:
          - RUNNING
          - WAITING_FOR_ANSWERS
          - WAITING_FOR_APPROVAL
          - COMPLETED
          - REJECTED
          - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        requirements:
          $ref: "#/components/schemas/Patterns"
        selfCheckAdded:
          type: integer
          format: int32
        gaps:
          $ref: "#/components/schemas/GapReport"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        finalItems:
          type: array
          items:
            $ref: "#/components/schemas/FinalItem"
        config:
          type: object
          additionalProperties: {}
        validation:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        revisions:
          type: integer
          format: int32
        uat:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
        uatCoverage:
          $ref: "#/components/schemas/Coverage"
        handoverReady:
          type: boolean
        openItems:
          type: array
          items:
            type: string
        approvalComment:
          type: string
    Answer:
      type: object
      properties:
        questionId:
          type: string
        choice:
          type: string
        text:
          type: string
    ApprovalRule:
      type: object
      properties:
        trigger:
          type: string
        approvers:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
    Check:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
        check:
          type: string
        message:
          type: string
        ref:
          type: string
        autoFixable:
          type: boolean
    Coverage:
      type: object
      properties:
        covered:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        uncovered:
          type: array
          items:
            type: string
    Decision:
      type: object
      properties:
        questionId:
          type: string
        itemName:
          type: string
        choice:
          type: string
        rationale:
          type: string
        interpretedByAgent:
          type: boolean
    Evidence:
      type: object
      properties:
        docId:
          type: string
        quote:
          type: string
    FinalItem:
      type: object
      properties:
        ref:
          type: string
        kind:
          type: string
          enum:
          - STAGE
          - ROLE
          - APPROVAL_RULE
        name:
          type: string
        source:
          type: string
        blueprintItemId:
          type: string
        peerSupport:
          type: string
        approvers:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        order:
          type: number
          format: double
    GapFinding:
      type: object
      properties:
        type:
          type: string
          enum:
          - MISSING
          - UNIQUE
          - ALIGNED
        kind:
          type: string
          enum:
          - STAGE
          - ROLE
          - APPROVAL_RULE
        name:
          type: string
        blueprintItemId:
          type: string
        peerSupport:
          type: string
        customerQuotes:
          type: array
          items:
            type: string
        message:
          type: string
    GapReport:
      type: object
      properties:
        industry:
          type: string
        workflowType:
          type: string
        geography:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/GapFinding"
    Patterns:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        approvalRules:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRule"
    Question:
      type: object
      properties:
        id:
          type: string
        findingType:
          type: string
          enum:
          - MISSING
          - UNIQUE
          - ALIGNED
        kind:
          type: string
          enum:
          - STAGE
          - ROLE
          - APPROVAL_RULE
        itemName:
          type: string
        blueprintItemId:
          type: string
        peerSupport:
          type: string
        question:
          type: string
        why:
          type: string
    Role:
      type: object
      properties:
        name:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
    Stage:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
          format: int32
        quotes:
          type: array
          items:
            type: string
    Step:
      type: object
      properties:
        "n":
          type: integer
          format: int32
        tool:
          type: string
        title:
          type: string
        reasoning:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        summary:
          type: string
    TestCase:
      type: object
      properties:
        id:
          type: string
        requirementRef:
          type: string
        type:
          type: string
        title:
          type: string
        steps:
          type: array
          items:
            type: string
        expected:
          type: string
    ApprovalRequest:
      type: object
      properties:
        approved:
          type: boolean
        comment:
          type: string
    AnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
    DocMeta:
      type: object
      properties:
        docId:
          type: string
        filename:
          type: string
        industry:
          type: string
        geography:
          type: string
        workflowType:
          type: string
    Extraction:
      type: object
      properties:
        doc:
          $ref: "#/components/schemas/DocMeta"
        patterns:
          $ref: "#/components/schemas/Patterns"
        droppedQuotes:
          type: integer
          format: int32
        selfCheck:
          $ref: "#/components/schemas/Patterns"
    Blueprint:
      type: object
      properties:
        industry:
          type: string
        workflowType:
          type: string
        sourceDocIds:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlueprintItem"
        orderConflicts:
          type: array
          items:
            $ref: "#/components/schemas/OrderConflict"
    BlueprintItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - STAGE
          - ROLE
          - APPROVAL_RULE
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        detail:
          type: string
        typicalOrder:
          type: number
          format: double
        support:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        geoSupport:
          type: array
          items:
            $ref: "#/components/schemas/GeoSupport"
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - EDITED
          - REJECTED
        editedDetail:
          type: string
        approvers:
          type: array
          items:
            type: string
    GeoSupport:
      type: object
      properties:
        geography:
          type: string
        support:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    OrderConflict:
      type: object
      properties:
        stageA:
          type: string
        stageB:
          type: string
        aFirstDocIds:
          type: array
          items:
            type: string
        bFirstDocIds:
          type: array
          items:
            type: string
    GapRequest:
      type: object
      properties:
        text:
          type: string
        geography:
          type: string
    Review:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - EDITED
          - REJECTED
        editedDetail:
          type: string
    RunSummary:
      type: object
      properties:
        id:
          type: string
        customerName:
          type: string
        industry:
          type: string
        workflowType:
          type: string
        geography:
          type: string
        status:
          type: string
          enum:
          - RUNNING
          - WAITING_FOR_ANSWERS
          - WAITING_FOR_APPROVAL
          - COMPLETED
          - REJECTED
          - FAILED
        createdAt:
          type: string
          format: date-time
    Group:
      type: object
      properties:
        industry:
          type: string
        workflowType:
          type: string
        docCount:
          type: integer
          format: int64
    EvalReport:
      type: object
      properties:
        industry:
          type: string
        workflowType:
          type: string
        docsEvaluated:
          type: integer
          format: int32
        docsSkipped:
          type: array
          items:
            type: string
        scores:
          type: array
          items:
            $ref: "#/components/schemas/KindScore"
        quotesKept:
          type: integer
          format: int32
        quotesDropped:
          type: integer
          format: int32
        withoutSelfCheck:
          type: array
          items:
            $ref: "#/components/schemas/KindScore"
        selfCheckAdded:
          type: integer
          format: int32
    KindScore:
      type: object
      properties:
        kind:
          type: string
          enum:
          - STAGE
          - ROLE
          - APPROVAL_RULE
        expected:
          type: integer
          format: int32
        extracted:
          type: integer
          format: int32
        matched:
          type: integer
          format: int32
        precision:
          type: number
          format: double
        recall:
          type: number
          format: double
        missed:
          type: array
          items:
            type: string
        extra:
          type: array
          items:
            type: string
